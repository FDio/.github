---
name: Terraform Nomad GHA Dispatcher

"on":
  push:
    paths:
      - "terraform/nomad-gha-dispatcher/**"
      - "terraform/nomad-gha-dispatcher/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-nomad-gha-dispatcher
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on:
      - self-hosted
      - nomad
      - fdio:arch=x86_64
      - fdio:class=builder
      - fdio:size=csit
      - fdio:namespace=prod
      - fdio:os=ubuntu2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Terraform
        # yamllint disable-line rule:line-length
        uses: fdio/.github/.github/actions/terraform-apply@main
        with:
          working-directory: terraform/nomad-gha-dispatcher
