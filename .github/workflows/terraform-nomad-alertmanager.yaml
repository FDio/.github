---
name: Terraform Nomad Alertmanager

"on":
  push:
    paths:
      - "terraform/nomad-alertmanager/**"
      - "terraform/nomad-alertmanager/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-nomad-alertmanager
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on:
      - self-hosted
      - nomad
      - fdio:arch=x86_64
      - fdio:class=builder
      - fdio:size=csit
      - fdio:namespace=prod
      - fdio:os=ubuntu2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run Terraform
        # yamllint disable-line rule:line-length
        uses: fdio/.github/.github/actions/terraform-apply@main
        with:
          working-directory: terraform/nomad-alertmanager
